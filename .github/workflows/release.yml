name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./scripts/build-android-release.sh "$VERSION"
        env:
          VERSION: ${{ github.ref_name }}

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            dist/MiDoid-android-${{ github.ref_name }}-debug.apk
            dist/MiDoid-android-${{ github.ref_name }}-debug.apk.sha256

  macos:
    name: Build macOS ZIP
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build macOS ZIP
        run: ./scripts/build-macos-release.sh "$VERSION"
        env:
          VERSION: ${{ github.ref_name }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/MiDoid-macOS-${{ github.ref_name }}.zip
            dist/MiDoid-macOS-${{ github.ref_name }}.zip.sha256

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - android
      - macos
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-artifacts/*
          body: |
            ## MiDoid ${{ github.ref_name }}

            ### What's new in ${{ github.ref_name }}

            - Redesigned the Android dashboard with a more polished visual system, updated status/access cards, and supporting icons.
            - Added Android share-sheet sending to Mac for files, photos, videos, and shared text.
            - Added Mac receiving for Android share-sheet transfers with notifications, live progress, and automatic photo opening or Finder reveal.
            - Added persistent pairing and more reliable reconnect behavior across app relaunches.
            - Improved transfer progress with visible speed, ETA, richer queue details, and Android notification progress.
            - Added Android foreground transfer protections so transfers can continue more reliably while the screen is off.
            - Added Mac file-type organization for received files, placing photos, videos, documents, and other files into matching folders.
            - Added WebDAV rename support from the Mac file browser, plus copy/duplicate and recursive search improvements.
            - Improved Mac menu bar visibility, fullscreen popover behavior, and menu bar icon contrast.
            - Hardened Android WebDAV serving with streaming responses, bounded workers/header parsing, cleaner shutdown, and safer file path handling.

            ### Install

            1. Open the Assets section on this GitHub Release.
            2. Download `MiDoid-android-${{ github.ref_name }}-debug.apk` on your Android device.
            3. Download `MiDoid-macOS-${{ github.ref_name }}.zip` on your Mac.
            4. On Android, install the APK from your downloads folder and allow sideloading if Android asks.
            5. On Mac, unzip the Mac release and open MiDoid.
            6. Scan the Mac QR code from the Android app.
            7. Choose the folder or storage mode Android should share with the Mac.

            ### Notes

            - MiDoid is local-first and does not use cloud servers.
            - Your Mac and Android device must be on the same local Wi-Fi network.
            - The Android APK is currently a debug/sideload build.
            - Optional All Files Access is intended for personal or sideloaded use.
            - The macOS ZIP may show Gatekeeper warnings until signing and notarization are added.
            - If macOS reports the network is offline while using a local IP address, allow MiDoid access to Local Network in macOS privacy settings.

            ### Still planned

            - Signed Android release APK.
            - Signed and notarized macOS app.
            - Resumable large-file transfers.
            - Stronger batch conflict handling for copy, rename, move, and recursive folder uploads.
            - Android transfer history and richer in-app transfer details.
