name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./scripts/build-android-release.sh "$VERSION"
        env:
          VERSION: ${{ github.ref_name }}

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            dist/MiDoid-android-${{ github.ref_name }}-debug.apk
            dist/MiDoid-android-${{ github.ref_name }}-debug.apk.sha256

  macos:
    name: Build macOS ZIP
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build macOS ZIP
        run: ./scripts/build-macos-release.sh "$VERSION"
        env:
          VERSION: ${{ github.ref_name }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/MiDoid-macOS-${{ github.ref_name }}.zip
            dist/MiDoid-macOS-${{ github.ref_name }}.zip.sha256

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - android
      - macos
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-artifacts/*
          body: |
            ## MiDoid ${{ github.ref_name }}

            ### What's new in v0.3

            - New split-pane macOS file browser with Android files on the left and rich details on the right.
            - Added a visible Kind column for clearer file types such as images, videos, PDFs, archives, audio, and folders.
            - Added right-pane previews for images and PDFs, with full-screen media preview support.
            - Added folder-level upload and download support through the existing local WebDAV session.
            - Added multi-select download actions for moving several files or folders at once.
            - Added safer delete confirmation before removing files or folders from Android.
            - Improved transfer panel details for folder transfers, including current file context.
            - Updated the Mac file manager window size and minimum size for the split-pane layout.

            ### Install

            1. Open the Assets section on this GitHub Release.
            2. Download `MiDoid-android-${{ github.ref_name }}-debug.apk` on your Android device.
            3. Download `MiDoid-macOS-${{ github.ref_name }}.zip` on your Mac.
            4. On Android, install the APK from your downloads folder and allow sideloading if Android asks.
            5. On Mac, unzip the Mac release and open MiDoid.
            6. Scan the Mac QR code from the Android app.
            7. Choose the folder or storage mode Android should share with the Mac.

            ### Notes

            - MiDoid is local-first and does not use cloud servers.
            - Your Mac and Android device must be on the same local Wi-Fi network.
            - The Android APK is currently a debug/sideload build.
            - Optional All Files Access is intended for personal or sideloaded use.
            - The macOS ZIP may show Gatekeeper warnings until signing and notarization are added.
            - If macOS reports the network is offline while using a local IP address, allow MiDoid access to Local Network in macOS privacy settings.

            ### Still planned

            - Signed Android release APK.
            - Signed and notarized macOS app.
            - More accurate transfer progress for very large folder operations.
            - Stronger conflict handling for recursive folder uploads.
            - Local notification mirroring research and privacy design.
